<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log Analyzer Dashboard</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #0f1117;
            --surface: #1a1d27;
            --surface-hover: #222632;
            --border: #2a2e3a;
            --text: #e4e4e7;
            --text-muted: #9ca3af;
            --accent: #6366f1;
            --debug: #6b7280;
            --info: #06b6d4;
            --warning: #f59e0b;
            --error: #ef4444;
            --critical: #a855f7;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
        }

        .container { max-width: 1280px; margin: 0 auto; padding: 24px; }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 32px;
            flex-wrap: wrap;
            gap: 16px;
        }

        header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        header h1 span { color: var(--accent); }

        .header-actions { display: flex; gap: 8px; flex-wrap: wrap; }

        button {
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text);
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.15s;
        }

        button:hover { background: var(--surface-hover); border-color: var(--accent); }
        button.primary { background: var(--accent); border-color: var(--accent); }
        button.primary:hover { opacity: 0.9; }
        button.danger { border-color: var(--error); color: var(--error); }
        button.danger:hover { background: rgba(239, 68, 68, 0.1); }

        /* Stats Cards */
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
            margin-bottom: 28px;
        }

        .stat-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }

        .stat-card .value {
            font-size: 2rem;
            font-weight: 700;
            line-height: 1.2;
        }

        .stat-card .label {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-top: 4px;
        }

        .stat-card.total .value { color: var(--text); }
        .stat-card.debug .value { color: var(--debug); }
        .stat-card.info .value { color: var(--info); }
        .stat-card.warning .value { color: var(--warning); }
        .stat-card.error .value { color: var(--error); }
        .stat-card.critical .value { color: var(--critical); }

        /* Filters */
        .filters {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            align-items: center;
        }

        .filters input, .filters select {
            padding: 8px 14px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text);
            font-size: 0.85rem;
            outline: none;
            transition: border-color 0.15s;
        }

        .filters input:focus, .filters select:focus { border-color: var(--accent); }
        .filters input { flex: 1; min-width: 200px; }

        /* Table */
        .table-wrapper {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
        }

        table { width: 100%; border-collapse: collapse; }

        th {
            text-align: left;
            padding: 14px 16px;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
        }

        td {
            padding: 12px 16px;
            font-size: 0.85rem;
            border-bottom: 1px solid var(--border);
            vertical-align: top;
        }

        tr:last-child td { border-bottom: none; }
        tr:hover td { background: var(--surface-hover); }

        .badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .badge-DEBUG    { background: rgba(107,114,128,0.15); color: var(--debug); }
        .badge-INFO     { background: rgba(6,182,212,0.15);   color: var(--info); }
        .badge-WARNING  { background: rgba(245,158,11,0.15);  color: var(--warning); }
        .badge-ERROR    { background: rgba(239,68,68,0.15);   color: var(--error); }
        .badge-CRITICAL { background: rgba(168,85,247,0.15);  color: var(--critical); }

        .suggestion { color: var(--warning); font-style: italic; }

        .raw-log {
            font-family: 'Cascadia Code', 'Fira Code', 'JetBrains Mono', monospace;
            font-size: 0.78rem;
            color: var(--text-muted);
            max-width: 400px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            cursor: pointer;
        }

        .raw-log.expanded {
            white-space: normal;
            word-break: break-all;
        }

        .source-tag {
            font-size: 0.75rem;
            color: var(--accent);
            font-weight: 500;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }

        .empty-state p { margin-top: 8px; font-size: 0.9rem; }

        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            padding: 12px 20px;
            border-radius: 10px;
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
            font-size: 0.85rem;
            z-index: 1000;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.3s;
        }

        .toast.show { opacity: 1; transform: translateY(0); }

        .section-title {
            font-size: 1.15rem;
            font-weight: 600;
            margin: 32px 0 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .incident-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 12px;
        }

        .incident-card h3 {
            font-size: 1rem;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .incident-card .meta {
            font-size: 0.82rem;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .incident-card .actions-list {
            list-style: none;
            padding: 0;
            margin: 8px 0 0;
        }

        .incident-card .actions-list li {
            font-size: 0.83rem;
            padding: 4px 0;
            color: var(--text);
        }

        .incident-card .actions-list li::before {
            content: '\2192 ';
            color: var(--accent);
        }

        .badge-severity {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        .badge-severity.low      { background: rgba(107,114,128,0.15); color: var(--debug); }
        .badge-severity.medium   { background: rgba(245,158,11,0.15);  color: var(--warning); }
        .badge-severity.high     { background: rgba(239,68,68,0.15);   color: var(--error); }
        .badge-severity.critical { background: rgba(168,85,247,0.15);  color: var(--critical); }

        .category-tag {
            font-size: 0.72rem;
            padding: 2px 8px;
            border-radius: 4px;
            background: rgba(99,102,241,0.12);
            color: var(--accent);
            font-weight: 500;
        }

        @media (max-width: 768px) {
            .container { padding: 16px; }
            .raw-log { max-width: 200px; }
            td, th { padding: 10px 12px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📊 <span>Log Analyzer</span> Dashboard</h1>
            <div class="header-actions">
                <button onclick="importLogs()" class="primary">📥 Import JSON</button>
                <button onclick="runCorrelation()" style="border-color:var(--critical);color:var(--critical)">🔗 Correlate Incidents</button>
                <button onclick="refreshData()">🔄 Refresh</button>
                <button onclick="clearLogs()" class="danger">🗑 Clear All</button>
            </div>
        </header>

        <div class="stats" id="stats">
            <div class="stat-card total">
                <div class="value" id="stat-total">-</div>
                <div class="label">Total Logs</div>
            </div>
            <div class="stat-card critical">
                <div class="value" id="stat-CRITICAL">0</div>
                <div class="label">Critical</div>
            </div>
            <div class="stat-card error">
                <div class="value" id="stat-ERROR">0</div>
                <div class="label">Error</div>
            </div>
            <div class="stat-card warning">
                <div class="value" id="stat-WARNING">0</div>
                <div class="label">Warning</div>
            </div>
            <div class="stat-card info">
                <div class="value" id="stat-INFO">0</div>
                <div class="label">Info</div>
            </div>
            <div class="stat-card debug">
                <div class="value" id="stat-DEBUG">0</div>
                <div class="label">Debug</div>
            </div>
        </div>

        <div class="filters">
            <input type="text" id="search" placeholder="🔍 Search logs..." oninput="debouncedFetch()">
            <select id="level-filter" onchange="fetchLogs()">
                <option value="">All Levels</option>
                <option value="CRITICAL">Critical</option>
                <option value="ERROR">Error</option>
                <option value="WARNING">Warning</option>
                <option value="INFO">Info</option>
                <option value="DEBUG">Debug</option>
            </select>
            <select id="source-filter" onchange="fetchLogs()">
                <option value="">All Sources</option>
            </select>
            <select id="category-filter" onchange="fetchLogs()">
                <option value="">All Categories</option>
            </select>
        </div>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Level</th>
                        <th>Source</th>
                        <th>Category</th>
                        <th>Summary</th>
                        <th>Suggestion</th>
                        <th>Raw Log</th>
                    </tr>
                </thead>
                <tbody id="log-table">
                </tbody>
            </table>
        </div>

        <div class="section-title">🔗 Incident Reports</div>
        <div id="incidents-list"></div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const API = '';
        let debounceTimer;

        function debouncedFetch() {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(fetchLogs, 300);
        }

        async function fetchStats() {
            try {
                const res = await fetch(`${API}/api/stats`);
                const data = await res.json();

                document.getElementById('stat-total').textContent = data.total;

                ['DEBUG', 'INFO', 'WARNING', 'ERROR', 'CRITICAL'].forEach(level => {
                    const el = document.getElementById(`stat-${level}`);
                    if (el) el.textContent = data.by_level[level] || 0;
                });

                const sourceFilter = document.getElementById('source-filter');
                const currentValue = sourceFilter.value;
                sourceFilter.innerHTML = '<option value="">All Sources</option>';
                Object.keys(data.by_source).sort().forEach(source => {
                    if (source) {
                        const opt = document.createElement('option');
                        opt.value = source;
                        opt.textContent = `${source} (${data.by_source[source]})`;
                        sourceFilter.appendChild(opt);
                    }
                });
                sourceFilter.value = currentValue;

                const catFilter = document.getElementById('category-filter');
                const currentCat = catFilter.value;
                catFilter.innerHTML = '<option value="">All Categories</option>';
                if (data.by_category) {
                    Object.keys(data.by_category).sort().forEach(cat => {
                        if (cat) {
                            const opt = document.createElement('option');
                            opt.value = cat;
                            opt.textContent = `${cat} (${data.by_category[cat]})`;
                            catFilter.appendChild(opt);
                        }
                    });
                }
                catFilter.value = currentCat;
            } catch (e) {
                console.error('Failed to fetch stats:', e);
            }
        }

        async function fetchLogs() {
            try {
                const params = new URLSearchParams();
                const level = document.getElementById('level-filter').value;
                const source = document.getElementById('source-filter').value;
                const category = document.getElementById('category-filter').value;
                const search = document.getElementById('search').value;

                if (level) params.set('level', level);
                if (source) params.set('source', source);
                if (category) params.set('category', category);
                if (search) params.set('search', search);
                params.set('limit', '200');

                const res = await fetch(`${API}/api/logs?${params}`);
                const logs = await res.json();

                const tbody = document.getElementById('log-table');

                if (logs.length === 0) {
                    tbody.innerHTML = `
                        <tr>
                            <td colspan="6">
                                <div class="empty-state">
                                    <p>📭 No logs found</p>
                                    <p>Import logs using the button above or analyze new logs via the API.</p>
                                </div>
                            </td>
                        </tr>`;
                    return;
                }

                tbody.innerHTML = logs.map(log => `
                    <tr>
                        <td><span class="badge badge-${log.log_level}">${log.log_level}</span></td>
                        <td><span class="source-tag">${log.source || '-'}</span></td>
                        <td><span class="category-tag">${escapeHtml(log.category || 'unknown')}</span></td>
                        <td>${escapeHtml(log.summary)}</td>
                        <td>${log.suggestion !== 'N/A'
                            ? `<span class="suggestion">${escapeHtml(log.suggestion)}</span>`
                            : '<span style="color:var(--text-muted)">—</span>'}</td>
                        <td><span class="raw-log" onclick="this.classList.toggle('expanded')" title="Click to expand">${escapeHtml(log.raw)}</span></td>
                    </tr>
                `).join('');
            } catch (e) {
                console.error('Failed to fetch logs:', e);
            }
        }

        async function importLogs() {
            try {
                const res = await fetch(`${API}/api/import?path=analysis_results.json`, { method: 'POST' });
                const data = await res.json();
                if (res.ok) {
                    showToast(`✅ Imported ${data.imported} logs`);
                    refreshData();
                } else {
                    showToast(`❌ ${data.detail}`);
                }
            } catch (e) {
                showToast('❌ Failed to import');
            }
        }

        async function clearLogs() {
            if (!confirm('Are you sure you want to delete all logs?')) return;
            try {
                const res = await fetch(`${API}/api/logs`, { method: 'DELETE' });
                const data = await res.json();
                showToast(`🗑 Deleted ${data.deleted} logs`);
                refreshData();
            } catch (e) {
                showToast('❌ Failed to clear logs');
            }
        }

        async function fetchIncidents() {
            try {
                const res = await fetch(`${API}/api/incidents`);
                const incidents = await res.json();
                const container = document.getElementById('incidents-list');

                if (incidents.length === 0) {
                    container.innerHTML = '<div class="empty-state" style="padding:30px"><p>No incident reports yet. Click "Correlate Incidents" to generate one.</p></div>';
                    return;
                }

                container.innerHTML = incidents.map(inc => `
                    <div class="incident-card">
                        <h3>
                            <span class="badge-severity ${inc.severity}">${inc.severity}</span>
                            ${escapeHtml(inc.title)}
                        </h3>
                        <div class="meta"><strong>Root cause:</strong> ${escapeHtml(inc.root_cause)}</div>
                        <div class="meta"><strong>Services:</strong> ${inc.affected_services.map(s => `<span class="source-tag">${escapeHtml(s)}</span>`).join(', ')}</div>
                        <div class="meta"><strong>Related lines:</strong> ${inc.related_log_lines.join(', ')}</div>
                        <ul class="actions-list">
                            ${inc.recommended_actions.map(a => `<li>${escapeHtml(a)}</li>`).join('')}
                        </ul>
                    </div>
                `).join('');
            } catch (e) {
                console.error('Failed to fetch incidents:', e);
            }
        }

        async function runCorrelation() {
            showToast('🔗 Correlating logs...');
            try {
                const res = await fetch(`${API}/api/correlate`, { method: 'POST' });
                const data = await res.json();
                if (res.ok) {
                    showToast(`✅ Incident detected: ${data.title}`);
                    fetchIncidents();
                } else {
                    showToast(`❌ ${data.detail}`);
                }
            } catch (e) {
                showToast('❌ Failed to correlate');
            }
        }

        function refreshData() {
            fetchStats();
            fetchLogs();
            fetchIncidents();
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        refreshData();
    </script>
</body>
</html>
